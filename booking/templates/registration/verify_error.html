{% extends "base.html" %}

{% block title %}認証エラー{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card card-wa pad text-center" style="max-width:480px;">
        <i class="bi bi-x-circle-fill auth-icon" style="color:var(--danger);"></i>
        <h1 style="font-size:20px;font-weight:800;margin-bottom:.5rem;">{{ error_title }}</h1>
        <p style="color:var(--ink-2);margin-bottom:1.5rem;">{{ error_message }}</p>
        <a href="{% url 'signup' %}" class="btn-wa btn-outline-wa"><i class="bi bi-arrow-repeat"></i>再度登録する</a>
    </div>
</div>
{% endblock %}
