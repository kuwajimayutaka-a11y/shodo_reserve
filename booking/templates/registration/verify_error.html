{% extends "base.html" %}

{% block title %}認証エラー{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-sm text-center" style="width: 100%; max-width: 480px; border-radius: 12px; border: none;">
        <div class="card-body p-5">
            <i class="bi bi-x-circle-fill text-danger" style="font-size: 3.5rem; margin-bottom: 16px; display:block;"></i>
            <h3 class="fw-bold mb-2" style="color: #2c3e50;">{{ error_title }}</h3>
            <p class="text-muted mb-4">{{ error_message }}</p>
            <a href="{% url 'signup' %}" class="btn btn-outline-primary px-5 py-2 fw-semibold">
                <i class="bi bi-arrow-repeat me-1"></i>再度登録する
            </a>
        </div>
    </div>
</div>
{% endblock %}
