{% extends "base.html" %}

{% block title %}ログイン{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card card-wa pad">
        <div class="text-center mb-4">
            <i class="bi bi-brush auth-icon" style="color:var(--navy);"></i>
            <h1 style="font-size:22px;font-weight:800;margin:0;">秀雪書道教室</h1>
            <p class="sub" style="color:var(--muted);margin:.25rem 0 0;">予約システム</p>
        </div>

        {% if form.non_field_errors %}
        <div class="alert-wa alert-wa-error"><i class="bi bi-exclamation-octagon-fill"></i><div>{{ form.non_field_errors.0 }}</div></div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label class="label"><i class="bi bi-envelope me-1"></i>メールアドレス</label>
                {{ form.username }}
            </div>
            <div class="field">
                <label class="label"><i class="bi bi-lock me-1"></i>パスワード</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn-wa btn-primary-wa btn-block-wa">ログイン</button>
        </form>

        <p class="text-center" style="margin:.9rem 0 0;">
            <a href="{% url 'password_reset' %}" style="color:var(--muted);font-size:13px;">パスワードをお忘れですか？</a>
        </p>

        <hr class="auth-divider">
        <p class="text-center" style="color:var(--muted);font-size:14px;margin:0;">
            アカウントをお持ちでないですか？
            <a href="{% url 'signup' %}" style="font-weight:700;">新規登録</a>
        </p>
    </div>
</div>
{% endblock %}
