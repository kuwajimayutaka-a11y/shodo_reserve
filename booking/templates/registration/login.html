{% extends "base.html" %}

{% block title %}ログイン{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-sm" style="width: 100%; max-width: 420px; border-radius: 12px; border: none;">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <i class="bi bi-brush" style="font-size: 2.5rem; margin-bottom: 8px; display:block; color:#0d9488;"></i>
                <h3 class="fw-bold" style="color: #2c3e50;">秀雪書道教室</h3>
                <p class="text-muted small">予約システム</p>
            </div>

            {% if form.non_field_errors %}
            <div class="alert alert-danger py-2">
                {{ form.non_field_errors.0 }}
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold text-secondary small">
                        <i class="bi bi-envelope me-1"></i>メールアドレス
                    </label>
                    {{ form.username }}
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold text-secondary small">
                        <i class="bi bi-lock me-1"></i>パスワード
                    </label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    ログイン
                </button>
            </form>

            <hr class="my-4">
            <p class="text-center text-muted small mb-0">
                アカウントをお持ちでないですか？
                <a href="{% url 'signup' %}" class="text-primary fw-semibold">新規登録</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
