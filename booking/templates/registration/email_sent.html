{% extends "base.html" %}

{% block title %}メール送信完了{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card card-wa pad text-center" style="max-width:480px;">
        <i class="bi bi-envelope-check auth-icon" style="color:var(--blue);"></i>
        <h1 style="font-size:20px;font-weight:800;margin-bottom:.75rem;">確認メールを送信しました</h1>
        <p style="color:var(--ink-2);line-height:1.7;">
            ご登録のメールアドレスに確認メールを送信しました。<br>
            メール内のリンクをクリックして認証を完了してください。
        </p>
        <hr class="auth-divider">
        <p style="color:var(--muted);font-size:13px;">
            メールが届かない場合は迷惑メールフォルダをご確認ください。<br>
            リンクの有効期限は3日間です。
        </p>
        <a href="{% url 'login' %}" class="btn-wa btn-outline-wa mt-2">ログイン画面へ</a>
    </div>
</div>
{% endblock %}
