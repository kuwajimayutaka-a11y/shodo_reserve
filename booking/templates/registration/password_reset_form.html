{% extends "base.html" %}

{% block title %}パスワード再設定{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card card-wa pad">
        <div class="text-center mb-4">
            <i class="bi bi-key auth-icon" style="color:var(--navy);"></i>
            <h1 style="font-size:20px;font-weight:800;margin:0;">パスワードの再設定</h1>
            <p class="sub" style="color:var(--muted);margin:.5rem 0 0;line-height:1.6;">
                ご登録のメールアドレスを入力してください。<br>
                再設定用のリンクをお送りします。
            </p>
        </div>

        <form method="post">
            {% csrf_token %}
            <div class="field">
                <label class="label"><i class="bi bi-envelope me-1"></i>メールアドレス</label>
                {{ form.email }}
                {% if form.email.errors %}
                <div class="alert-wa alert-wa-error mt-2"><i class="bi bi-exclamation-octagon-fill"></i><div>{{ form.email.errors.0 }}</div></div>
                {% endif %}
            </div>
            <button type="submit" class="btn-wa btn-primary-wa btn-block-wa">再設定リンクを送信</button>
        </form>

        <hr class="auth-divider">
        <p class="text-center" style="color:var(--muted);font-size:14px;margin:0;">
            <a href="{% url 'login' %}" style="font-weight:700;">ログイン画面へ戻る</a>
        </p>
    </div>
</div>
{% endblock %}
