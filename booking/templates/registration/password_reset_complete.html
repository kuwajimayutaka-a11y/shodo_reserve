{% extends "base.html" %}

{% block title %}パスワード変更完了{% endblock %}

{% block content %}
<div class="auth-wrap">
    <div class="auth-card card-wa pad text-center" style="max-width:480px;">
        <i class="bi bi-check-circle-fill auth-icon" style="color:var(--success);"></i>
        <h1 style="font-size:20px;font-weight:800;margin-bottom:.5rem;">パスワードを変更しました</h1>
        <p style="color:var(--ink-2);margin-bottom:1.5rem;">新しいパスワードでログインしてください。</p>
        <a href="{% url 'login' %}" class="btn-wa btn-primary-wa"><i class="bi bi-box-arrow-in-right"></i>ログインへ</a>
    </div>
</div>
{% endblock %}
