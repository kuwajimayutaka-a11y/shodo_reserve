{# params: field (Django BoundField), label (str, 省略時はfield.label), hint (str, optional) #}
<div class="field">
    <label class="label" for="{{ field.id_for_label }}">{{ label|default:field.label }}</label>
    {{ field }}
    {% if hint %}<div class="field-hint">{{ hint }}</div>{% endif %}
    {% for error in field.errors %}<div class="field-error">{{ error }}</div>{% endfor %}
</div>
